name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\src\WindowsIOSUniversalClipboard\WindowsIOSUniversalClipboard.csproj `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish\${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\${{ matrix.rid }}\WindowsIOSUniversalClipboard.exe `
            -DestinationPath .\windows-ios-universal-clipboard-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-ios-universal-clipboard-${{ matrix.rid }}
          path: windows-ios-universal-clipboard-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.zip
