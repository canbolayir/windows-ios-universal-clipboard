name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\src\WindowsIOSUniversalClipboard\WindowsIOSUniversalClipboard.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\publish\win-x64

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\publish\win-x64\WindowsIOSUniversalClipboard.exe `
            -DestinationPath .\windows-ios-universal-clipboard-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: windows-ios-universal-clipboard-win-x64.zip
